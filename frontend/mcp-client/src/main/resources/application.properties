server.port=8086

# This client creates MCP clients manually so Spring's automatic tool callback client is disabled.
spring.ai.mcp.client.toolcallback.enabled=false

# Single OpenAI-compatible model used by the POC client.
# Use the provider base URL, not the full /v1/chat/completions endpoint.
# Examples:
#   OpenRouter: https://openrouter.ai/api
#   xAI/Grok:   https://api.x.ai
poc.llm.base-url=https://openrouter.ai/api/v1/chat/completions
poc.llm.api-key==<YOUR_OPENROUTER_API_KEY>
poc.llm.model=deepseek/deepseek-r1-distill-llama-70b:free

# MCP server connection. This should point at mcp-poc/backend.
poc.mcp.endpoint=http://localhost:8085/mcp
poc.mcp.connection-timeout=60s

management.server.port=9096
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=info,health,readiness,metrics

spring.main.banner-mode=off
logging.file.name=./target/mcp-poc-client.log
